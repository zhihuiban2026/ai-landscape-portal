<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>研究過程</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ef;--card:#ffffff;--text:#1c1c1c;--muted:#7a7a7a;--accent:#3a5a40;--accent-bg:#eef3ee;--border:#e2ded7;--radius:12px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

header{padding:40px 48px 32px;border-bottom:1px solid var(--border)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;font-size:.82rem;margin-bottom:20px;letter-spacing:.02em}
.back:hover{text-decoration:underline}
.header-meta{font-size:.72rem;letter-spacing:.28em;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.header-title{font-family:'Noto Serif TC',serif;font-size:clamp(1.4rem,3vw,2rem);font-weight:300}
.header-name{font-size:.9rem;color:var(--muted);margin-top:6px}

main{max-width:820px;margin:0 auto;padding:48px 24px 100px}

.top-bar{display:flex;justify-content:flex-end;margin-bottom:32px}

/* View */
.blocks{display:flex;flex-direction:column;gap:36px}
.block-text{font-size:.95rem;line-height:1.95;color:var(--text);white-space:pre-wrap;word-break:break-word}
.block-img{display:flex;flex-direction:column;align-items:center;gap:10px}
.block-img img{max-width:100%;border-radius:var(--radius);border:1px solid var(--border);display:block}
.block-caption{font-size:.82rem;color:var(--muted);text-align:center;line-height:1.6}
.empty{text-align:center;padding:80px 24px;color:var(--muted);font-size:.9rem;line-height:2}

/* Buttons */
.btn{padding:10px 20px;border-radius:8px;font-size:.84rem;font-family:'Noto Sans TC',sans-serif;cursor:pointer;border:none;transition:all .18s;letter-spacing:.02em}
.btn-accent{background:var(--accent);color:#fff}
.btn-accent:hover{background:#2d4831}
.btn-outline{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn-outline:hover{background:var(--accent-bg)}
.btn-ghost{background:transparent;color:var(--muted);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.btn-danger{background:transparent;color:#c0392b;border:1.5px solid #e8c5c0}
.btn-danger:hover{background:#fdf2f2;border-color:#c0392b}
.btn-sm{padding:6px 14px;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* Password overlay */
.overlay{display:none;position:fixed;inset:0;background:rgba(20,20,20,.42);backdrop-filter:blur(4px);z-index:300;align-items:center;justify-content:center}
.overlay.open{display:flex}
.modal{background:#fff;border-radius:18px;padding:40px 36px;width:90%;max-width:420px;box-shadow:0 24px 72px rgba(0,0,0,.15);animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.modal-h{font-family:'Noto Serif TC',serif;font-size:1.15rem;font-weight:400;margin-bottom:6px}
.modal-sub{font-size:.82rem;color:var(--muted);margin-bottom:24px;line-height:1.7}
.field label{display:block;font-size:.76rem;color:var(--muted);letter-spacing:.06em;margin-bottom:6px}
.field input{width:100%;padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;font-size:.9rem;font-family:'Noto Sans TC',sans-serif;outline:none;background:#fafaf8}
.field input:focus{border-color:var(--accent);background:#fff}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.modal-err{font-size:.82rem;color:#c0392b;margin-top:10px;min-height:1.2em}

/* Editor */
#editor{display:none}
.editor-toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:28px;padding:16px 20px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);position:sticky;top:12px;z-index:100;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.editor-toolbar span{flex:1}
.editor-blocks{display:flex;flex-direction:column;gap:16px}

.edit-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;transition:border-color .18s}
.edit-block:focus-within{border-color:rgba(58,90,64,.35)}
.block-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;user-select:none}
.block-hdr-type{font-weight:500;color:var(--accent)}
.block-controls{margin-left:auto;display:flex;gap:6px}

.edit-block textarea{width:100%;min-height:120px;border:1.5px solid var(--border);border-radius:8px;padding:13px 15px;font-family:'Noto Sans TC',sans-serif;font-size:.92rem;line-height:1.85;resize:vertical;outline:none;background:#fafaf8;transition:border-color .18s,background .18s}
.edit-block textarea:focus{border-color:var(--accent);background:#fff}

.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:36px 24px;text-align:center;color:var(--muted);font-size:.85rem;cursor:pointer;transition:border-color .18s,background .18s;line-height:1.7}
.drop-zone:hover,.drop-zone.drag{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.img-preview{max-width:100%;border-radius:8px;border:1px solid var(--border);margin-bottom:12px;display:block}
.caption-field{width:100%;margin-top:10px;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-family:'Noto Sans TC',sans-serif;font-size:.85rem;outline:none;background:#fafaf8}
.caption-field:focus{border-color:var(--accent);background:#fff}
input[type="file"]{display:none}

.save-bar{display:flex;align-items:center;gap:16px;margin-top:32px;justify-content:flex-end;flex-wrap:wrap}
.save-msg{font-size:.84rem;line-height:1.5}
.save-msg.ok{color:var(--accent)}
.save-msg.err{color:#c0392b}

@media(max-width:640px){
  header{padding:28px 20px 24px}
  main{padding:32px 16px 60px}
  .editor-toolbar{top:0;border-radius:0 0 var(--radius) var(--radius)}
}
</style>
</head>
<body>

<header>
  <a href="index-future-office.html" class="back">← 回研究成果</a>
  <div class="header-meta">研究過程記錄</div>
  <div class="header-title" id="hTitle">載入中…</div>
  <div class="header-name" id="hName"></div>
</header>

<main>
  <div class="top-bar">
    <button class="btn btn-outline" id="editBtn" onclick="openPwModal()">編輯研究過程</button>
  </div>

  <!-- Viewer -->
  <div id="viewer">
    <div class="blocks" id="blockView"></div>
    <div class="empty" id="emptyMsg" style="display:none">
      尚未填寫研究過程內容。<br>
      點擊右上角「編輯研究過程」開始新增。
    </div>
  </div>

  <!-- Editor -->
  <div id="editor">
    <div class="editor-toolbar">
      <button class="btn btn-accent btn-sm" onclick="addTextBlock()">＋ 文字</button>
      <button class="btn btn-accent btn-sm" onclick="addImgBlock()">＋ 圖片</button>
      <span></span>
      <button class="btn btn-ghost btn-sm" onclick="exitEdit()">取消</button>
    </div>
    <div class="editor-blocks" id="editorBlocks"></div>
    <div class="save-bar">
      <span class="save-msg" id="saveMsg"></span>
      <button class="btn btn-accent" id="saveBtn" onclick="saveProcess()">儲存</button>
    </div>
  </div>
</main>

<!-- Password Modal -->
<div class="overlay" id="pwOverlay" onclick="if(event.target===this)closePwModal()">
  <div class="modal">
    <div class="modal-h">進入編輯模式</div>
    <div class="modal-sub">請輸入你的個人密碼以編輯研究過程內容。</div>
    <div class="field">
      <label>密碼</label>
      <input type="password" id="pwInput" placeholder="輸入密碼"
             onkeydown="if(event.key==='Enter')verifyPw()">
    </div>
    <div class="modal-err" id="pwErr"></div>
    <div class="modal-btns">
      <button class="btn btn-ghost btn-sm" onclick="closePwModal()">取消</button>
      <button class="btn btn-accent btn-sm" onclick="verifyPw()">確認</button>
    </div>
  </div>
</div>

<script>
let idx = -1, studentData = null, blocks = [], editPw = '';

const params = new URLSearchParams(location.search);
idx = parseInt(params.get('i') ?? '0', 10);

// ── Init ──────────────────────────────────────────────────────────────────
async function init() {
  const r = await fetch('data.json?_=' + Date.now());
  const data = await r.json();
  if (idx < 0 || idx >= data.length) {
    document.getElementById('hTitle').textContent = '找不到此研究員';
    return;
  }
  studentData = data[idx];
  document.title = studentData.name + ' — 研究過程';
  document.getElementById('hTitle').textContent = studentData.project;
  document.getElementById('hName').textContent = studentData.name;
  await loadBlocks();
}

async function loadBlocks() {
  try {
    const r = await fetch('process-' + idx + '.json?_=' + Date.now());
    blocks = r.ok ? ((await r.json()).blocks || []) : [];
  } catch { blocks = []; }
  renderView();
}

// ── View ──────────────────────────────────────────────────────────────────
function renderView() {
  const view = document.getElementById('blockView');
  const empty = document.getElementById('emptyMsg');
  if (!blocks.length) { view.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  view.innerHTML = blocks.map(b => {
    if (b.type === 'text') {
      return '<div class="block-text">' + esc(b.content) + '</div>';
    }
    if (b.type === 'image') {
      return '<div class="block-img"><img src="' + b.src + '" alt="' + esc(b.caption||'') + '">' +
        (b.caption ? '<div class="block-caption">' + esc(b.caption) + '</div>' : '') + '</div>';
    }
    return '';
  }).join('');
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Password ──────────────────────────────────────────────────────────────
function openPwModal() {
  document.getElementById('pwInput').value = '';
  document.getElementById('pwErr').textContent = '';
  document.getElementById('pwOverlay').classList.add('open');
  setTimeout(() => document.getElementById('pwInput').focus(), 80);
}
function closePwModal() { document.getElementById('pwOverlay').classList.remove('open'); }
function verifyPw() {
  const pw = document.getElementById('pwInput').value.trim();
  if (!pw) { document.getElementById('pwErr').textContent = '請輸入密碼'; return; }
  if (!studentData || pw !== studentData.password) {
    document.getElementById('pwErr').textContent = '密碼錯誤，請再試一次';
    return;
  }
  editPw = pw;
  closePwModal();
  enterEdit();
}

// ── Edit ──────────────────────────────────────────────────────────────────
function enterEdit() {
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('editor').style.display = 'block';
  document.getElementById('editBtn').style.display = 'none';
  document.getElementById('saveMsg').textContent = '';
  renderEditor();
}
function exitEdit() {
  document.getElementById('editor').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  document.getElementById('editBtn').style.display = '';
  editPw = '';
}

function renderEditor() {
  const container = document.getElementById('editorBlocks');
  container.innerHTML = '';
  blocks.forEach((b, i) => container.appendChild(makeBlockEl(b, i)));
}

function makeBlockEl(block, i) {
  const div = document.createElement('div');
  div.className = 'edit-block';
  div.dataset.idx = i;
  const first = i === 0, last = i === blocks.length - 1;
  const controls = `
    <div class="block-controls">
      <button class="btn btn-ghost btn-sm" onclick="moveBlock(${i},-1)" ${first?'disabled':''} title="上移">↑</button>
      <button class="btn btn-ghost btn-sm" onclick="moveBlock(${i},1)"  ${last?'disabled':''} title="下移">↓</button>
      <button class="btn btn-danger btn-sm" onclick="delBlock(${i})">刪除</button>
    </div>`;

  if (block.type === 'text') {
    div.innerHTML = `<div class="block-hdr"><span class="block-hdr-type">文字</span>${controls}</div>
      <textarea placeholder="輸入文字內容…">${esc(block.content||'')}</textarea>`;
    div.querySelector('textarea').addEventListener('input', e => { blocks[i].content = e.target.value; });
  } else {
    div.innerHTML = `<div class="block-hdr"><span class="block-hdr-type">圖片</span>${controls}</div>
      ${block.src ? `<img class="img-preview" src="${block.src}" alt="">` : ''}
      <div class="drop-zone" id="dz-${i}">${block.src?'點擊更換圖片':'點擊選擇圖片，或直接拖曳圖片到此處'}</div>
      <input type="file" id="fi-${i}" accept="image/*">
      <input class="caption-field" type="text" placeholder="圖片說明（選填）" value="${esc(block.caption||'')}">`;

    const dz = div.querySelector('.drop-zone');
    const fi = div.querySelector('input[type=file]');
    dz.onclick = () => fi.click();
    fi.onchange = () => fi.files[0] && loadImg(i, fi.files[0], div);
    dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
    dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
    dz.addEventListener('drop', e => {
      e.preventDefault(); dz.classList.remove('drag');
      e.dataTransfer.files[0]?.type.startsWith('image/') && loadImg(i, e.dataTransfer.files[0], div);
    });
    div.querySelector('.caption-field').addEventListener('input', e => { blocks[i].caption = e.target.value; });
  }
  return div;
}

function loadImg(i, file, div) {
  const reader = new FileReader();
  reader.onload = e => {
    const image = new Image();
    image.onload = () => {
      // Compress to max 1400px wide, 82% quality
      const MAX = 1400, q = 0.82;
      let w = image.width, h = image.height;
      if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(image, 0, 0, w, h);
      const src = cv.toDataURL('image/jpeg', q);
      blocks[i].src = src;
      let prev = div.querySelector('.img-preview');
      if (!prev) { prev = document.createElement('img'); prev.className = 'img-preview'; div.querySelector('.drop-zone').before(prev); }
      prev.src = src;
      div.querySelector('.drop-zone').textContent = '點擊更換圖片';
    };
    image.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function addTextBlock() {
  blocks.push({ type: 'text', content: '' });
  renderEditor();
  document.getElementById('editorBlocks').lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function addImgBlock() {
  blocks.push({ type: 'image', src: '', caption: '' });
  renderEditor();
  document.getElementById('editorBlocks').lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function moveBlock(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= blocks.length) return;
  [blocks[i], blocks[j]] = [blocks[j], blocks[i]];
  renderEditor();
}
function delBlock(i) {
  if (!confirm('確定刪除此區塊？')) return;
  blocks.splice(i, 1);
  renderEditor();
}

// ── Save ──────────────────────────────────────────────────────────────────
async function saveProcess() {
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('saveMsg');
  btn.disabled = true;
  msg.textContent = '儲存中…'; msg.className = 'save-msg';
  try {
    const r = await fetch('/api/save-process', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ index: idx, blocks, password: editPw })
    });
    const res = await r.json();
    if (res.success) {
      msg.textContent = '✓ 儲存成功！'; msg.className = 'save-msg ok';
      renderView();
      setTimeout(() => { exitEdit(); }, 1500);
    } else {
      msg.textContent = res.error || '儲存失敗'; msg.className = 'save-msg err';
    }
  } catch {
    msg.textContent = '網路錯誤，請稍後再試'; msg.className = 'save-msg err';
  } finally { btn.disabled = false; }
}

init();
</script>
</body>
</html>
